<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Abstract engineering cost data engine">
  <defs>
    <radialGradient id="coreGlow" cx="52%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#6cf7c8" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#34d6b4" stop-opacity="0.55"/>
      <stop offset="52%" stop-color="#237a89" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#061017" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steelGlow" cx="72%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#74c7ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0a1119" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8fff0" stop-opacity="0.58"/>
      <stop offset="52%" stop-color="#55788e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39e7bb" stop-opacity="0"/>
      <stop offset="45%" stop-color="#39e7bb" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#83c9ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d7fff5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.23 0 0 0 0 0.95 0 0 0 0 0.75 0 0 0 0.9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

